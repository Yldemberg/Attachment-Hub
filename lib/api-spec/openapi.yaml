openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: iHub - Marketplace Management Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: accounts
    description: Mercado Livre account integrations
  - name: products
    description: Product and inventory management
  - name: inventory
    description: Inventário geral e estoque mandatário por SKU
  - name: orders
    description: Order management
  - name: payments
    description: Mercado Pago payment details
  - name: questions
    description: Customer question management
  - name: notifications
    description: In-app notifications
  - name: dashboard
    description: Dashboard KPIs and analytics
  - name: promotions
    description: Mercado Livre seller promotions and campaigns
  - name: webhooks
    description: External webhook receivers

paths:
  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      description: Returns the authenticated user's profile and plan details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Accounts
  # ---------------------------------------------------------------------------
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all connected ML accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
                required: [data]

  /accounts/connect/url:
    get:
      operationId: getConnectUrl
      tags: [accounts]
      summary: Get Mercado Livre OAuth authorization URL
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OAuth authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  state:
                    type: string
                required: [url, state]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /accounts/connect/callback:
    get:
      operationId: handleConnectCallback
      tags: [accounts]
      summary: OAuth callback — exchange code for tokens
      description: No JWT auth. Handles Mercado Livre OAuth redirect.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to /integrations after successful connection
        "400":
          $ref: "#/components/responses/BadRequest"

  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get a specific ML account
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Remove ML account integration
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Account removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{id}/mp-credentials:
    put:
      operationId: upsertMpCredentials
      tags: [accounts]
      summary: Salvar credenciais do app Mercado Pago para uma conta
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMpCredentialsRequest"
      responses:
        "200":
          description: Credenciais salvas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpCredentialsStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMpCredentials
      tags: [accounts]
      summary: Remover credenciais do app Mercado Pago de uma conta
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Credenciais removidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpCredentialsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{id}/sync:
    post:
      operationId: syncAccount
      tags: [accounts]
      summary: Trigger full sync for a ML account
      description: Syncs products, orders, and questions from Mercado Livre
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "202":
          description: Sync initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Products
  # ---------------------------------------------------------------------------
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with filters and pagination
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: listing_filter
          in: query
          description: >-
            Filtro único por status do anúncio (active, paused, closed, under_review)
            ou por característica (flex, full, promo, catalog). Omitir para listar todos.
          schema:
            type: string
            enum: [active, paused, closed, under_review, flex, full, promo, catalog]
        - name: search
          in: query
          description: >-
            Busca por MLB (ID do anúncio), SKU, título ou texto em variações.
            Várias palavras: todas devem aparecer (ordem irrelevante).
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: picker
          in: query
          description: >-
            Quando true (1/true/yes): retorna anúncios só do banco, sem chamadas ao Mercado Livre para preços
            ou catalog_listing; ignora o parâmetro search; permite limit até 5000. Uso recomendado para UI de
            seleção rápida (combobox).
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a traditional Mercado Livre listing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Mercado Livre API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/categories/predict:
    get:
      operationId: predictProductCategory
      tags: [products]
      summary: Predict Mercado Livre category from title
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
        - name: title
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category predictions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MlCategoryPrediction"
                required: [data]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/categories/{categoryId}/attributes:
    get:
      operationId: getProductCategoryAttributes
      tags: [products]
      summary: Get category attributes for listing form
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category attributes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MlCategoryAttribute"
                required: [data]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/pictures:
    post:
      operationId: uploadProductPicture
      tags: [products]
      summary: Upload picture for a new or updated listing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadProductPictureRequest"
      responses:
        "200":
          description: Picture uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadProductPictureResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/low-stock:
    get:
      operationId: getLowStockProducts
      tags: [products]
      summary: Get products with low stock
      security:
        - bearerAuth: []
      parameters:
        - name: threshold
          in: query
          schema:
            type: integer
            default: 5
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Low stock products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                required: [data]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product details
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update an existing Mercado Livre listing
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Listing updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Mercado Livre API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Close a Mercado Livre listing
      description: Sets listing status to closed on Mercado Livre (ML does not permanently delete listings).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Listing closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  productId:
                    type: string
                  status:
                    type: string
                    enum: [closed]
                required: [success, productId, status]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/duplicate:
    post:
      operationId: duplicateProduct
      tags: [products]
      summary: Duplicate a listing to another Mercado Livre account
      description: >
        Copia título/família, categoria, preço, estoque, fotos, atributos, garantia e descrição do anúncio
        de origem e publica um novo anúncio na conta de destino.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateProductRequest"
      responses:
        "201":
          description: Listing duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Mercado Livre API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/listing-detail:
    get:
      operationId: getProductListingDetail
      tags: [products]
      summary: Get live listing data from Mercado Livre for edit form
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Live listing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListingDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/status:
    patch:
      operationId: updateProductListingStatus
      tags: [products]
      summary: Pause or activate a listing (Mercado Livre)
      description: Sets listing status to active or paused via ML API. Only listings currently active or paused can be toggled.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductListingStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  productId:
                    type: string
                  status:
                    type: string
                    enum: [active, paused]
                required: [success, productId, status]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/stock:
    patch:
      operationId: updateProductStock
      tags: [products]
      summary: Update stock for a single product
      description: Updates available_quantity for a single product by its ID. Returns 400 for FULL (Fulfillment) items.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStockRequest"
      responses:
        "200":
          description: Stock updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  productId:
                    type: string
                  quantity:
                    type: integer
                required: [success, productId, quantity]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/sku/{sku}/stock:
    patch:
      operationId: updateStockBySku
      tags: [products]
      summary: Update stock for all products with matching SKU
      description: Updates available_quantity for all non-FULL products sharing the same SKU. Optionally scoped to a single account via account_id query param.
      security:
        - bearerAuth: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          required: false
          description: Restrict update to products belonging to this account
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStockRequest"
      responses:
        "200":
          description: Stock update results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStockResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /inventory/search:
    get:
      operationId: searchInventory
      tags: [inventory]
      summary: Buscar SKUs para inventário geral
      description: >-
        Lista anúncios com SKU (Full e não Full), agrupados por SKU (título, variação, estoque mandatário).
        Busca por SKU, MLB, título ou texto em variações (mesma lógica de tokens que /products).
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: >-
            Texto ou código de barras / SKU. Se omitido ou vazio, retorna todos os SKUs
            de anúncios da conta (Full e não Full).
      responses:
        "200":
          description: Resultados agrupados por SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /inventory/sku/{sku}/financials:
    patch:
      operationId: patchInventorySkuFinancials
      tags: [inventory]
      summary: Salvar imposto e preço de compra por SKU
      description: >-
        Persiste percentual de imposto (0–100) e preço de compra (BRL) para o SKU no escopo do usuário.
        Exige pelo menos um anúncio (Full ou não Full) com esse SKU. Campos omitidos mantêm o valor anterior.
      security:
        - bearerAuth: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
          description: SKU (URL-encoded se necessário)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventorySkuFinancialsPatchRequest"
      responses:
        "200":
          description: Valores salvos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySkuFinancialsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /inventory/mandate-adjust:
    post:
      operationId: adjustMandateInventory
      tags: [inventory]
      summary: Ajustar estoque mandatário e espelhar nos anúncios
      description: >-
        Atualiza sku_mandate_inventory e aplica a quantidade em todos os anúncios não Full
        com o mesmo SKU nas contas do usuário.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MandateAdjustRequest"
      responses:
        "200":
          description: Resultado do espelhamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateAdjustResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /inventory/sync-sku:
    post:
      operationId: syncSkuStock
      tags: [inventory]
      summary: Forçar re-sincronização de estoque por SKU
      description: >-
        Lê o estoque atual no ML do anúncio fonte (o indicado por sourceProductId ou o primeiro ativo)
        e propaga o valor para todos os anúncios não-Full com o mesmo SKU nas contas do usuário.
        Anúncios Full são completamente ignorados.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkuSyncRequest"
      responses:
        "200":
          description: Resultado da sincronização
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkuSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Orders
  # ---------------------------------------------------------------------------
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders with filters and pagination
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: shipment_phase
          in: query
          description: Filtro exclusivo por fase logística (ML shipping). Não misturar conceito com `status` (pagamento).
          schema:
            type: string
            enum: [label_issued, in_transit]
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/{paymentId}:
    get:
      operationId: getMercadoPagoPayment
      tags: [payments]
      summary: Get Mercado Pago payment details
      description: >-
        Proxies GET https://api.mercadopago.com/v1/payments/{paymentId} using the OAuth token
        of the connected Mercado Livre account (`account_id`). No extra Mercado Pago secrets are required.
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: Mercado Pago payment ID (also present in ML order `payments[].id`).
        - name: account_id
          in: query
          required: true
          schema:
            type: string
          description: iHub account UUID whose ML OAuth token will authorize the Mercado Pago request.
      responses:
        "200":
          description: Mercado Pago payment payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MercadoPagoPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Mercado Pago upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Mercado Pago request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

