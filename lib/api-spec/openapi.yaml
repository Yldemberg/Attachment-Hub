          nullable: true
        status:
          type: string
          nullable: true
          description: Status do período na API ML (OPEN/CLOSED), quando disponível.
      required:
        - key

    MlExtraCostsBreakdown:
      type: object
      properties:
        periodKey:
          type: string
          nullable: true
        selectedPeriodKey:
          type: string
          nullable: true
          description: Mês calendário selecionado na consulta (YYYY-MM-01).
        periodFrom:
          type: string
          format: date
          nullable: true
        periodTo:
          type: string
          format: date
          nullable: true
        productAds:
          type: number
          description: Campanhas Product Ads (tipo PADS no resumo de faturamento).
        fullShipping:
          type: number
          description: Custos Full de envio/coleta (INBOUND_COLLECT, WITHDRAWAL, etc.).
        fullStorage:
          type: number
          description: Custos Full de armazenamento (WAREHOUSING, AGING, OVERAGE, etc.).
        totalExtraCosts:
          type: number
        available:
          type: boolean
        message:
          type: string
          nullable: true
        availablePeriods:
          type: array
          items:
            $ref: "#/components/schemas/MlBillingPeriodOption"
      required:
        - productAds
        - fullShipping
        - fullStorage
        - totalExtraCosts
        - available
        - availablePeriods

    SalesChartDataPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        revenue:
          type: number
        orders:
          type: integer
      required: [date, revenue, orders]

    SalesChartResponse:
      type: object
      properties:
        period:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/SalesChartDataPoint"
      required: [period, data]

    SalesReportPeriod:
      type: object
      properties:
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
      required: [dateFrom, dateTo]

    SalesReportSummary:
      type: object
      properties:
        orderCount:
          type: integer
        revenue:
          type: number
      required: [orderCount, revenue]

    SalesReportRow:
      type: object
      properties:
        referenceDate:
          type: string
          format: date
        mlOrderId:
          type: integer
          format: int64
          nullable: true
        accountNickname:
          type: string
          nullable: true
        orderTotal:
          type: number
          nullable: true
          description: Total do pedido no ML (total_amount).
        productPurchaseTotal:
          type: number
          description: Soma do preço de compra salvo no inventário × quantidade, por SKU.
        marketplaceFeesTotal:
          type: number
          description: Soma de marketplace_fee nos pagamentos (preenchido na sincronização do pedido).
        shippingTotal:
          type: number
          description: Soma de shipping_cost nos pagamentos.
        taxTotal:
          type: number
          description: Imposto estimado (% por SKU sobre o subtotal de cada linha).
        netReceivedAmount:
          type: number
          nullable: true
          description: >-
            Soma de transaction_details.net_received_amount dos pagamentos no Mercado Pago
            (GET /v1/payments/{id}).
        profit:
          type: number
          nullable: true
          description: À receber (net_received_amount) − imposto − preço de compra dos produtos.
      required:
        - referenceDate
        - productPurchaseTotal
        - marketplaceFeesTotal
        - shippingTotal
        - taxTotal
        - profit

    SalesReportResponse:
      type: object
      properties:
        period:
          $ref: "#/components/schemas/SalesReportPeriod"
        summary:
          $ref: "#/components/schemas/SalesReportSummary"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SalesReportRow"
      required: [period, summary, rows]

    # --------------------------------------------------------------------------
    # Webhooks
    # --------------------------------------------------------------------------
    MercadoLivreWebhookPayload:
      type: object
      properties:
        _id:
          type: string
        resource:
          type: string
        user_id:
          type: integer
        topic:
          type: string
        application_id:
          type: string
        attempts:
          type: integer
        sent:
          type: string
        received:
          type: string
      required: [resource, user_id, topic]
