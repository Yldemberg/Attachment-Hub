openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: iHub - Marketplace Management Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: accounts
    description: Mercado Livre account integrations
  - name: products
    description: Product and inventory management
  - name: inventory
    description: Inventário geral e estoque mandatário por SKU
  - name: orders
    description: Order management
  - name: payments
    description: Mercado Pago payment details
  - name: questions
    description: Customer question management
  - name: notifications
    description: In-app notifications
  - name: dashboard
    description: Dashboard KPIs and analytics
  - name: webhooks
    description: External webhook receivers

paths:
  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      description: Returns the authenticated user's profile and plan details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Accounts
  # ---------------------------------------------------------------------------
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all connected ML accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
                required: [data]

  /accounts/connect/url:
    get:
      operationId: getConnectUrl
      tags: [accounts]
      summary: Get Mercado Livre OAuth authorization URL
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OAuth authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  state:
                    type: string
                required: [url, state]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /accounts/connect/callback:
    get:
      operationId: handleConnectCallback
      tags: [accounts]
      summary: OAuth callback — exchange code for tokens
      description: No JWT auth. Handles Mercado Livre OAuth redirect.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to /integrations after successful connection
        "400":
          $ref: "#/components/responses/BadRequest"

  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get a specific ML account
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Remove ML account integration
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Account removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{id}/mp-credentials:
    put:
      operationId: upsertMpCredentials
      tags: [accounts]
      summary: Salvar credenciais do app Mercado Pago para uma conta
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMpCredentialsRequest"
      responses:
        "200":
          description: Credenciais salvas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpCredentialsStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMpCredentials
      tags: [accounts]
      summary: Remover credenciais do app Mercado Pago de uma conta
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Credenciais removidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpCredentialsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{id}/sync:
    post:
      operationId: syncAccount
      tags: [accounts]
      summary: Trigger full sync for a ML account
      description: Syncs products, orders, and questions from Mercado Livre
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "202":
          description: Sync initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Products
  # ---------------------------------------------------------------------------
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with filters and pagination
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: listing_filter
          in: query
          description: >-
            Filtro único por status do anúncio (active, paused, closed, under_review)
            ou por característica (flex, full, promo, catalog). Omitir para listar todos.
          schema:
            type: string
            enum: [active, paused, closed, under_review, flex, full, promo, catalog]
        - name: search
          in: query
          description: >-
            Busca por MLB (ID do anúncio), SKU, título ou texto em variações.
            Várias palavras: todas devem aparecer (ordem irrelevante).
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: picker
          in: query
          description: >-
            Quando true (1/true/yes): retorna anúncios só do banco, sem chamadas ao Mercado Livre para preços
            ou catalog_listing; ignora o parâmetro search; permite limit até 5000. Uso recomendado para UI de
            seleção rápida (combobox).
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/low-stock:
    get:
      operationId: getLowStockProducts
      tags: [products]
      summary: Get products with low stock
      security:
        - bearerAuth: []
      parameters:
        - name: threshold
          in: query
          schema:
            type: integer
            default: 5
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Low stock products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                required: [data]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product details
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/status:
    patch:
      operationId: updateProductListingStatus
      tags: [products]
      summary: Pause or activate a listing (Mercado Livre)
      description: Sets listing status to active or paused via ML API. Only listings currently active or paused can be toggled.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductListingStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  productId:
                    type: string
                  status:
                    type: string
                    enum: [active, paused]
                required: [success, productId, status]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/stock:
    patch:
      operationId: updateProductStock
      tags: [products]
      summary: Update stock for a single product
      description: Updates available_quantity for a single product by its ID. Returns 400 for FULL (Fulfillment) items.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStockRequest"
      responses:
        "200":
          description: Stock updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  productId:
                    type: string
                  quantity:
                    type: integer
                required: [success, productId, quantity]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/sku/{sku}/stock:
    patch:
      operationId: updateStockBySku
      tags: [products]
      summary: Update stock for all products with matching SKU
      description: Updates available_quantity for all non-FULL products sharing the same SKU. Optionally scoped to a single account via account_id query param.
      security:
        - bearerAuth: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          required: false
          description: Restrict update to products belonging to this account
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStockRequest"
      responses:
        "200":
          description: Stock update results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStockResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /inventory/search:
    get:
      operationId: searchInventory
      tags: [inventory]
      summary: Buscar SKUs para inventário geral
      description: >-
        Lista anúncios com SKU (Full e não Full), agrupados por SKU (título, variação, estoque mandatário).
        Busca por SKU, MLB, título ou texto em variações (mesma lógica de tokens que /products).
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: >-
            Texto ou código de barras / SKU. Se omitido ou vazio, retorna todos os SKUs
            de anúncios da conta (Full e não Full).
      responses:
        "200":
          description: Resultados agrupados por SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /inventory/sku/{sku}/financials:
    patch:
      operationId: patchInventorySkuFinancials
      tags: [inventory]
      summary: Salvar imposto e preço de compra por SKU
      description: >-
        Persiste percentual de imposto (0–100) e preço de compra (BRL) para o SKU no escopo do usuário.
        Exige pelo menos um anúncio (Full ou não Full) com esse SKU. Campos omitidos mantêm o valor anterior.
      security:
        - bearerAuth: []
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
          description: SKU (URL-encoded se necessário)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventorySkuFinancialsPatchRequest"
      responses:
        "200":
          description: Valores salvos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySkuFinancialsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /inventory/mandate-adjust:
    post:
      operationId: adjustMandateInventory
      tags: [inventory]
      summary: Ajustar estoque mandatário e espelhar nos anúncios
      description: >-
        Atualiza sku_mandate_inventory e aplica a quantidade em todos os anúncios não Full
        com o mesmo SKU nas contas do usuário.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MandateAdjustRequest"
      responses:
        "200":
          description: Resultado do espelhamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateAdjustResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /inventory/sync-sku:
    post:
      operationId: syncSkuStock
      tags: [inventory]
      summary: Forçar re-sincronização de estoque por SKU
      description: >-
        Lê o estoque atual no ML do anúncio fonte (o indicado por sourceProductId ou o primeiro ativo)
        e propaga o valor para todos os anúncios não-Full com o mesmo SKU nas contas do usuário.
        Anúncios Full são completamente ignorados.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkuSyncRequest"
      responses:
        "200":
          description: Resultado da sincronização
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkuSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Orders
  # ---------------------------------------------------------------------------
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders with filters and pagination
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: shipment_phase
          in: query
          description: Filtro exclusivo por fase logística (ML shipping). Não misturar conceito com `status` (pagamento).
          schema:
            type: string
            enum: [label_issued, in_transit]
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/{paymentId}:
    get:
      operationId: getMercadoPagoPayment
      tags: [payments]
      summary: Get Mercado Pago payment details
      description: >-
        Proxies GET https://api.mercadopago.com/v1/payments/{paymentId} using the OAuth token
        of the connected Mercado Livre account (`account_id`). No extra Mercado Pago secrets are required.
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: Mercado Pago payment ID (also present in ML order `payments[].id`).
        - name: account_id
          in: query
          required: true
          schema:
            type: string
          description: iHub account UUID whose ML OAuth token will authorize the Mercado Pago request.
      responses:
        "200":
          description: Mercado Pago payment payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MercadoPagoPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Mercado Pago upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Mercado Pago request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Questions
  # ---------------------------------------------------------------------------
  /questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List questions with filters and pagination
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [unanswered, answered, closed_unanswered, under_review]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /questions/{id}:
    get:
      operationId: getQuestion
      tags: [questions]
      summary: Get question details
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Question details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /questions/{id}/answer:
    post:
      operationId: answerQuestion
      tags: [questions]
      summary: Answer a customer question
      description: Sends the answer to Mercado Livre and updates the local record
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerQuestionRequest"
      responses:
        "200":
          description: Answer sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Notifications
  # ---------------------------------------------------------------------------
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      security:
        - bearerAuth: []
      parameters:
        - name: is_read
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPI summary
      description: Returns consolidated KPIs including today/month sales, pending orders, and unanswered questions
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/sales-chart:
    get:
      operationId: getSalesChart
      tags: [dashboard]
      summary: Get sales chart data
      description: Returns daily sales data for the specified period
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sales chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesChartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/sales-report:
    get:
      operationId: getSalesReport
      tags: [dashboard]
      summary: Relatório de vendas por período
      description: >-
        Lista pedidos pagos/confirmados no período (data de referência America/Sao_Paulo).
        Cada linha traz: total do pedido, preço de compra dos produtos (inventário), taxas e frete do ML
        (gravados ao sincronizar o pedido), imposto estimado (% por SKU) e lucro
        (subtotal dos itens − taxas − imposto − preço de compra). JSON, CSV, XLSX ou PDF.
      security:
        - bearerAuth: []
      parameters:
        - name: date_from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: account_id
          in: query
          schema:
            type: string
        - name: format
          in: query
          description: Saída JSON (prévia) ou ficheiro para download
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
            default: json
      responses:
        "200":
          description: Relatório (JSON ou ficheiro binário)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReportResponse"
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Webhooks
  # ---------------------------------------------------------------------------
  /webhooks/mercadolivre:
    post:
      operationId: handleMercadoLivreWebhook
      tags: [webhooks]
      summary: Receive Mercado Livre webhook notifications
      description: No JWT auth. Responds 200 immediately and processes async.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MercadoLivreWebhookPayload"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]

  /webhooks/stripe:
    post:
      operationId: handleStripeWebhook
      tags: [webhooks]
      summary: Receive Stripe webhook events
      description: No JWT auth. Validates Stripe signature and processes subscription events.
      responses:
        "200":
          description: Processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                required: [received]

# ==============================================================================
# Components
# ==============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # --------------------------------------------------------------------------
    # Shared
    # --------------------------------------------------------------------------
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required: [page, limit, total, totalPages]

    # --------------------------------------------------------------------------
    # Auth
    # --------------------------------------------------------------------------
    UserProfile:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        plan:
          type: string
          enum: [trial, basic, pro]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        stripeCustomerId:
          type: string
          nullable: true
        stripeSubscriptionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, plan, createdAt]

    # --------------------------------------------------------------------------
    # Accounts
    # --------------------------------------------------------------------------
    Account:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        mlUserId:
          type: string
          nullable: true
        mlNickname:
          type: string
          nullable: true
        mlEmail:
          type: string
          nullable: true
        isActive:
          type: boolean
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        hasMpCredentials:
          type: boolean
          description: Indica se a conta tem credenciais MP configuradas (client_id + access_token)
        mpClientIdMasked:
          type: string
          nullable: true
          description: Últimos 4 chars do Client ID (ou null se não configurado)
        mpClientSecretMasked:
          type: string
          nullable: true
          description: Últimos 4 chars do Client Secret (ou null se não configurado)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, isActive, hasMpCredentials, createdAt, updatedAt]

    UpsertMpCredentialsRequest:
      type: object
      properties:
        mpClientId:
          type: string
          description: Client ID do app Mercado Pago
        mpClientSecret:
          type: string
          description: Client Secret do app Mercado Pago
        mpAccessToken:
          type: string
          description: Access Token de produção do app Mercado Pago
      required: [mpClientId, mpClientSecret, mpAccessToken]

    MpCredentialsStatus:
      type: object
      properties:
        hasMpCredentials:
          type: boolean
        mpClientIdMasked:
          type: string
          nullable: true
        mpClientSecretMasked:
          type: string
          nullable: true
      required: [hasMpCredentials]

    # --------------------------------------------------------------------------
    # Products
    # --------------------------------------------------------------------------
    Product:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        mlItemId:
          type: string
        title:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        originalPrice:
          type: number
          nullable: true
        amount:
          type: number
          nullable: true
          description: >
            Somente na resposta de GET /products: preço atual via GET /items/{id}/prices
            (prices[].amount). Outras rotas não consultam /prices.
        regularAmount:
          type: number
          nullable: true
          description: >
            Somente em GET /products: preço regular (prices[].regular_amount) quando há promoção.
        availableQuantity:
          type: integer
        soldQuantity:
          type: integer
        status:
          type: string
          nullable: true
        listingType:
          type: string
          nullable: true
        logisticType:
          type: string
          nullable: true
        isFull:
          type: boolean
        isFlex:
          type: boolean
        catalogListing:
          type: boolean
          description: >
            True quando o anúncio vem de catálogo compartilhado do ML (GET /items → catalog_listing).
        videoId:
          type: string
          nullable: true
          description: >
            Presente em GET /products: ID do vídeo/clip do anúncio quando GET /items retorna video_id;
            null quando não há clip ou a consulta ao ML falha.
        thumbnail:
          type: string
          nullable: true
        permalink:
          type: string
          nullable: true
        mlCategoryId:
          type: string
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/AccountSummary"
          nullable: true
      required: [id, accountId, mlItemId, availableQuantity, soldQuantity, isFull, isFlex, catalogListing, createdAt, updatedAt]

    AccountSummary:
      type: object
      properties:
        id:
          type: string
        mlNickname:
          type: string
          nullable: true
        mlUserId:
          type: string
          nullable: true
      required: [id]

    ProductListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [data, pagination]

    UpdateStockRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 0
      required: [quantity]

    UpdateProductListingStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, paused]
      required: [status]

    UpdateStockResponse:
      type: object
      properties:
        sku:
          type: string
        updated:
          type: integer
        skipped:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              mlItemId:
                type: string
              success:
                type: boolean
              reason:
                type: string
                nullable: true
            required: [productId, mlItemId, success]
      required: [sku, updated, skipped, failed, results]

    InventorySearchItem:
      type: object
      properties:
        sku:
          type: string
        mandateQuantity:
          type: integer
          nullable: true
          description: Valor em sku_mandate_inventory, se existir
        thumbnail:
          type: string
          nullable: true
        titleShort:
          type: string
        variationLabel:
          type: string
          nullable: true
          description: Cor / tamanho etc. quando há variações
        currentStock:
          type: integer
          description: Estoque no anúncio representativo (banco)
        representativeProductId:
          type: string
        listingCount:
          type: integer
          description: Quantidade total de anúncios (Full e não Full) com este SKU
        nonFullListingCount:
          type: integer
          description: Quantidade de anúncios não Full com este SKU (0 = só Full)
        taxPercent:
          type: number
          nullable: true
          description: Percentual de imposto (0–100) salvo pelo usuário
        purchasePrice:
          type: number
          nullable: true
          description: Preço de compra de referência (BRL)
      required:
        - sku
        - titleShort
        - currentStock
        - representativeProductId
        - listingCount
        - nonFullListingCount

    InventorySkuFinancialsPatchRequest:
      type: object
      properties:
        taxPercent:
          type: number
          nullable: true
          description: Percentual de imposto (0–100); null remove o valor
        purchasePrice:
          type: number
          nullable: true
          description: Preço de compra em BRL; null remove o valor
      description: Pelo menos uma propriedade deve ser enviada.

    InventorySkuFinancialsResponse:
      type: object
      properties:
        sku:
          type: string
        taxPercent:
          type: number
          nullable: true
        purchasePrice:
          type: number
          nullable: true
      required: [sku]

    InventorySearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/InventorySearchItem"
      required: [data]

    MandateAdjustRequest:
      type: object
      properties:
        sku:
          type: string
        operation:
          type: string
          enum: [add, subtract, set]
        amount:
          type: integer
          minimum: 0
      required: [sku, operation, amount]

    MandateAdjustResponse:
      type: object
      properties:
        sku:
          type: string
        mandateQuantity:
          type: integer
        updated:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              mlItemId:
                type: string
              success:
                type: boolean
              reason:
                type: string
                nullable: true
            required: [productId, mlItemId, success]
      required: [sku, mandateQuantity, updated, failed, results]

    SkuSyncRequest:
      type: object
      properties:
        sku:
          type: string
          description: SKU a sincronizar
        sourceProductId:
          type: string
          nullable: true
          description: ID interno do produto a ser usado como fonte de estoque (opcional)
      required: [sku]

    SkuSyncResponse:
      type: object
      properties:
        synced:
          type: integer
          description: Quantidade de anúncios sincronizados com sucesso (incluindo fonte)
        skipped:
          type: integer
          description: Quantidade de anúncios que falharam na sincronização
        sku:
          type: string
        newStock:
          type: integer
          description: Estoque propagado para todos os anúncios irmãos
      required: [synced, skipped, sku, newStock]

    # --------------------------------------------------------------------------
    # Orders
    # --------------------------------------------------------------------------
    OrderItem:
      type: object
      properties:
        item_id:
          type: string
        title:
          type: string
        quantity:
          type: integer
        price:
          type: number
        thumbnail:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        logistic_type:
          type: string
          nullable: true
      required: [item_id, quantity, price]

    Order:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        mlOrderId:
          type: integer
        status:
          type: string
          nullable: true
        totalAmount:
          type: number
          nullable: true
        currencyId:
          type: string
          nullable: true
        buyerId:
          type: integer
          nullable: true
        buyerNickname:
          type: string
          nullable: true
        shippingId:
          type: integer
          nullable: true
        shippingStatus:
          type: string
          nullable: true
        shippingSubstatus:
          type: string
          nullable: true
        dateCreated:
          type: string
          format: date-time
          nullable: true
        dateClosed:
          type: string
          format: date-time
          nullable: true
        itemsJson:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/AccountSummary"
          nullable: true
      required: [id, accountId, mlOrderId, createdAt, updatedAt]

    OrderListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [data, pagination]

    MercadoPagoPayment:
      type: object
      description: Raw payload from Mercado Pago GET /v1/payments/{id}
      additionalProperties: true

    # --------------------------------------------------------------------------
    # Questions
    # --------------------------------------------------------------------------
    Question:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        mlQuestionId:
          type: integer
        mlItemId:
          type: string
          nullable: true
        text:
          type: string
          nullable: true
        status:
          type: string
          enum: [unanswered, answered, closed_unanswered, under_review]
        fromUserId:
          type: integer
          nullable: true
        fromUserNickname:
          type: string
          nullable: true
        answerText:
          type: string
          nullable: true
        answerDate:
          type: string
          format: date-time
          nullable: true
        dateCreated:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        listingThumbnailUrl:
          type: string
          nullable: true
          description: Miniatura do anúncio (produto vinculado no iHub)
        listingPermalink:
          type: string
          nullable: true
          description: URL pública do anúncio no Mercado Livre
        account:
          $ref: "#/components/schemas/AccountSummary"
          nullable: true
      required: [id, accountId, mlQuestionId, status, createdAt, updatedAt]

    QuestionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [data, pagination]

    AnswerQuestionRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required: [text]

    # --------------------------------------------------------------------------
    # Notifications
    # --------------------------------------------------------------------------
    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        accountId:
          type: string
          nullable: true
        accountNickname:
          type: string
          nullable: true
        type:
          type: string
          enum: [new_question, new_order, low_stock, order_update, sync_error, sync_complete, item_update, stock_update]
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: string
          nullable: true
        listingThumbnailUrl:
          type: string
          nullable: true
          description: Miniatura do anúncio (nova pergunta)
        listingPermalink:
          type: string
          nullable: true
          description: Link do anúncio no Mercado Livre
        createdAt:
          type: string
          format: date-time
      required: [id, userId, type, title, message, isRead, createdAt]

    NotificationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        pagination:
          $ref: "#/components/schemas/Pagination"
        unreadCount:
          type: integer
      required: [data, pagination, unreadCount]

    # --------------------------------------------------------------------------
    # Dashboard
    # --------------------------------------------------------------------------
    DashboardSummary:
      type: object
      properties:
        salesToday:
          type: number
        salesMonth:
          type: number
        ordersToday:
          type: integer
        ordersMonth:
          type: integer
        pendingOrders:
          type: integer
        unansweredQuestions:
          type: integer
        criticalStockCount:
          type: integer
        activeAccounts:
          type: integer
      required: [salesToday, salesMonth, ordersToday, ordersMonth, pendingOrders, unansweredQuestions, criticalStockCount, activeAccounts]

    SalesChartDataPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        revenue:
          type: number
        orders:
          type: integer
      required: [date, revenue, orders]

    SalesChartResponse:
      type: object
      properties:
        period:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/SalesChartDataPoint"
      required: [period, data]

    SalesReportPeriod:
      type: object
      properties:
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
      required: [dateFrom, dateTo]

    SalesReportSummary:
      type: object
      properties:
        orderCount:
          type: integer
        revenue:
          type: number
      required: [orderCount, revenue]

    SalesReportRow:
      type: object
      properties:
        referenceDate:
          type: string
          format: date
        mlOrderId:
          type: integer
          format: int64
          nullable: true
        accountNickname:
          type: string
          nullable: true
        orderTotal:
          type: number
          nullable: true
          description: Total do pedido no ML (total_amount).
        productPurchaseTotal:
          type: number
          description: Soma do preço de compra salvo no inventário × quantidade, por SKU.
        marketplaceFeesTotal:
          type: number
          description: Soma de marketplace_fee nos pagamentos (preenchido na sincronização do pedido).
        shippingTotal:
          type: number
          description: Soma de shipping_cost nos pagamentos.
        taxTotal:
          type: number
          description: Imposto estimado (% por SKU sobre o subtotal de cada linha).
        netReceivedAmount:
          type: number
          nullable: true
          description: >-
            Soma de transaction_details.net_received_amount dos pagamentos no Mercado Pago
            (GET /v1/payments/{id}).
        profit:
          type: number
          description: Subtotal dos itens − taxas ML − imposto − preço de compra dos produtos.
      required:
        - referenceDate
        - productPurchaseTotal
        - marketplaceFeesTotal
        - shippingTotal
        - taxTotal
        - profit

    SalesReportResponse:
      type: object
      properties:
        period:
          $ref: "#/components/schemas/SalesReportPeriod"
        summary:
          $ref: "#/components/schemas/SalesReportSummary"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SalesReportRow"
      required: [period, summary, rows]

    # --------------------------------------------------------------------------
    # Webhooks
    # --------------------------------------------------------------------------
    MercadoLivreWebhookPayload:
      type: object
      properties:
        _id:
          type: string
        resource:
          type: string
        user_id:
          type: integer
        topic:
          type: string
        application_id:
          type: string
        attempts:
          type: integer
        sent:
          type: string
        received:
          type: string
      required: [resource, user_id, topic]
