  /promotions:
    get:
      operationId: listPromotions
      tags: [promotions]
      summary: List ML promotion campaigns
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: promotion_type
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Filter by campaign status. Omit or use `active` for open campaigns only (started/pending, not expired). Use `all` to include finished.
          schema:
            type: string
            default: active
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: refresh
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Paginated list of campaigns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /promotions/price-discount:
    post:
      operationId: createPriceDiscount
      tags: [promotions]
      summary: Create a seller PRICE_DISCOUNT (percentage/individual discount) on an item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePriceDiscountRequest"
      responses:
        "200":
          description: Discount created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /promotions/{promotionId}:
    get:
      operationId: getPromotion
      tags: [promotions]
      summary: Get promotion campaign details
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          required: true
          schema:
            type: string
        - name: promotion_type
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /promotions/{promotionId}/items:
    get:
      operationId: listPromotionItems
      tags: [promotions]
      summary: List items in a promotion campaign
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          required: true
          schema:
            type: string
        - name: promotion_type
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Item status in campaign (candidate, pending, started, finished)
          schema:
            type: string
        - name: item_id
          in: query
          description: Filter by Mercado Livre item ID
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: refresh
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Paginated promotion items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionItemListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /promotions/{promotionId}/items/bulk:
    post:
      operationId: bulkActivatePromotionItems
      tags: [promotions]
      summary: Activate multiple items in a promotion
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActivatePromotionItemsRequest"
      responses:
        "200":
          description: Bulk activation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActivatePromotionItemsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /promotions/{promotionId}/items/{itemId}:
    post:
      operationId: activatePromotionItem
      tags: [promotions]
      summary: Add or activate an item in a promotion
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivatePromotionItemRequest"
      responses:
        "200":
          description: Item activated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updatePromotionItem
      tags: [promotions]
      summary: Update promotion price for an item
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivatePromotionItemRequest"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: removePromotionItem
      tags: [promotions]
      summary: Remove an item from a promotion
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          required: true
          schema:
            type: string
        - name: promotion_type
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item removed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Notifications
  # ---------------------------------------------------------------------------
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      security:
        - bearerAuth: []
      parameters:
        - name: is_read
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPI summary
      description: Returns consolidated KPIs including today/month sales, pending orders, and unanswered questions
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/ml-extra-costs:
    get:
      operationId: getMlExtraCosts
      tags: [dashboard]
      summary: Custos extras cobrados pelo Mercado Livre
      description: >-
        Product Ads, envios Full e armazenamento Full acumulados no mês calendário selecionado
        (padrão: mês atual). Use period_key para consultar meses anteriores (formato YYYY-MM-01).
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: period_key
          in: query
          description: Chave do mês calendário (YYYY-MM-01). Padrão = mês atual (America/Sao_Paulo).
          schema:
            type: string
            example: "2026-05-01"
      responses:
        "200":
          description: Breakdown de custos extras ML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MlExtraCostsBreakdown"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/sales-chart:
    get:
      operationId: getSalesChart
      tags: [dashboard]
      summary: Get sales chart data
      description: Returns daily sales data for the specified period
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sales chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesChartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/sales-report:
    get:
      operationId: getSalesReport
      tags: [dashboard]
      summary: Relatório de vendas por período
      description: >-
        Lista pedidos pagos/confirmados no período (data de referência America/Sao_Paulo).
        Cada linha traz: total do pedido, preço de compra dos produtos (inventário), taxas e frete do ML
        (gravados ao sincronizar o pedido), imposto estimado (% por SKU) e lucro
        (subtotal dos itens − taxas − imposto − preço de compra). JSON, CSV, XLSX ou PDF.
      security:
        - bearerAuth: []
      parameters:
        - name: date_from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: account_id
          in: query
          schema:
            type: string
        - name: format
          in: query
          description: Saída JSON (prévia) ou ficheiro para download
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
            default: json
      responses:
        "200":
          description: Relatório (JSON ou ficheiro binário)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReportResponse"
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Webhooks
  # ---------------------------------------------------------------------------
  /webhooks/mercadolivre:
    post:
      operationId: handleMercadoLivreWebhook
      tags: [webhooks]
      summary: Receive Mercado Livre webhook notifications
      description: No JWT auth. Responds 200 immediately and processes async.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MercadoLivreWebhookPayload"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]

  /webhooks/stripe:
    post:
      operationId: handleStripeWebhook
      tags: [webhooks]
      summary: Receive Stripe webhook events
      description: No JWT auth. Validates Stripe signature and processes subscription events.
      responses:
        "200":
          description: Processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                required: [received]

  /webhooks/n8n/listing-prepared:
    post:
      operationId: handleN8nListingPrepared
      tags: [webhooks]
      summary: N8N callback when a listing prepare job completes
      description: >-
        No JWT auth. Validates N8N_WEBHOOK_SECRET via Authorization Bearer or X-N8N-Secret header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/N8nListingPreparedWebhookPayload"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]
        "401":
          description: Invalid webhook secret

# ==============================================================================
# Components
# ==============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # --------------------------------------------------------------------------
    # Shared
    # --------------------------------------------------------------------------
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required: [page, limit, total, totalPages]

    # --------------------------------------------------------------------------
    # Auth
    # --------------------------------------------------------------------------
    UserProfile:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        plan:
          type: string
          enum: [trial, basic, pro]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        stripeCustomerId:
          type: string
          nullable: true
        stripeSubscriptionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, plan, createdAt]

    # --------------------------------------------------------------------------
    # Accounts
    # --------------------------------------------------------------------------
    Account:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        platform:
          type: string
          description: mercadolivre | amazon
          enum: [mercadolivre, amazon]
        mlUserId:
          type: string
          nullable: true
        mlNickname:
          type: string
          nullable: true
        mlEmail:
          type: string
          nullable: true
        amazonSellerId:
          type: string
          nullable: true
        amazonMarketplaceId:
          type: string
          nullable: true
        amazonStoreName:
          type: string
          nullable: true
        isActive:
          type: boolean
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        hasMpCredentials:
          type: boolean
          description: Indica se a conta tem credenciais MP configuradas (client_id + access_token)
        mpClientIdMasked:
          type: string
          nullable: true
          description: Últimos 4 chars do Client ID (ou null se não configurado)
        mpClientSecretMasked:
          type: string
          nullable: true
          description: Últimos 4 chars do Client Secret (ou null se não configurado)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, platform, isActive, hasMpCredentials, createdAt, updatedAt]

    UpsertMpCredentialsRequest:
      type: object
      properties:
        mpClientId:
          type: string
          description: Client ID do app Mercado Pago
        mpClientSecret:
          type: string
          description: Client Secret do app Mercado Pago
        mpAccessToken:
          type: string
          description: Access Token de produção do app Mercado Pago
      required: [mpClientId, mpClientSecret, mpAccessToken]

    MpCredentialsStatus:
      type: object
      properties:
        hasMpCredentials:
          type: boolean
        mpClientIdMasked:
          type: string
          nullable: true
        mpClientSecretMasked:
          type: string
          nullable: true
      required: [hasMpCredentials]

    # --------------------------------------------------------------------------
    # Products
    # --------------------------------------------------------------------------
    Product:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        mlItemId:
          type: string
          nullable: true
        amazonSku:
          type: string
          nullable: true
        amazonAsin:
          type: string
          nullable: true
        amazonProductType:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        originalPrice:
          type: number
          nullable: true
        amount:
          type: number
          nullable: true
          description: >
            Somente na resposta de GET /products: preço atual via GET /items/{id}/prices
            (prices[].amount). Outras rotas não consultam /prices.
        regularAmount:
          type: number
          nullable: true
          description: >
            Somente em GET /products: preço regular (prices[].regular_amount) quando há promoção.
        availableQuantity:
          type: integer
        soldQuantity:
          type: integer
        status:
          type: string
          nullable: true
        listingType:
          type: string
          nullable: true
        logisticType:
          type: string
          nullable: true
        isFull:
          type: boolean
        isFlex:
          type: boolean
        catalogListing:
          type: boolean
          description: >
            True quando o anúncio vem de catálogo compartilhado do ML (GET /items → catalog_listing).
        videoId:
          type: string
          nullable: true
          description: >
            Presente em GET /products: ID do vídeo/clip do anúncio quando GET /items retorna video_id;
            null quando não há clip ou a consulta ao ML falha.
        thumbnail:
          type: string
          nullable: true
        permalink:
          type: string
          nullable: true
        mlCategoryId:
          type: string
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/AccountSummary"
          nullable: true
      required: [id, accountId, availableQuantity, soldQuantity, isFull, isFlex, catalogListing, createdAt, updatedAt]

    AccountSummary:
      type: object
      properties:
        id:
          type: string
        platform:
          type: string
          nullable: true
        mlNickname:
          type: string
          nullable: true
        mlUserId:
          type: string
          nullable: true
        amazonStoreName:
          type: string
          nullable: true
        amazonSellerId:
          type: string
          nullable: true
      required: [id]

    ProductListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [data, pagination]

    UpdateStockRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 0
      required: [quantity]

    UpdateProductListingStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, paused]
      required: [status]

    BulkUpdateProductListingStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, paused]
        product_ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 500
      required: [status, product_ids]

    BulkUpdateProductListingStatusResult:
      type: object
      properties:
        productId:
          type: string
        mlItemId:
          type: string
          nullable: true
        ok:
          type: boolean
        error:
          type: string
        skipped:
          type: boolean
      required: [productId, ok]

    BulkUpdateProductListingStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
          enum: [active, paused]
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkUpdateProductListingStatusResult"
        summary:
          type: object
          properties:
            updated:
              type: integer
            skipped:
              type: integer
            failed:
              type: integer
          required: [updated, skipped, failed]
      required: [success, status, results, summary]

    MlCategoryPrediction:
      type: object
      properties:
        categoryId:
          type: string
        categoryName:
          type: string
        domainId:
          type: string
          nullable: true
        domainName:
          type: string
          nullable: true
      required: [categoryId, categoryName]

    MlCategoryAttribute:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        valueType:
          type: string
        tags:
          type: object
          nullable: true
          properties:
            required:
              type: boolean
            catalog_required:
              type: boolean
            fixed:
              type: boolean
            read_only:
              type: boolean
        values:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required: [id, name]
        allowedUnits:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required: [id, name]
        defaultUnit:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
      required: [id, name, valueType]

    MlListingAttributeInput:
      type: object
      properties:
        id:
          type: string
        value_name:
          type: string
        value_id:
          type: string
          nullable: true
      required: [id, value_name]

    MlListingVariationInput:
      type: object
      properties:
        attribute_combinations:
          type: array
          items:
            $ref: "#/components/schemas/MlListingAttributeInput"
        price:
          type: number
        available_quantity:
          type: integer
        picture_ids:
          type: array
          items:
