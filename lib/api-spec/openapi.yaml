  # ---------------------------------------------------------------------------
  # Listing Templates (modelos de anúncio)
  # ---------------------------------------------------------------------------
  /listing-templates:
    get:
      operationId: listListingTemplates
      tags: [listing-templates]
      summary: Listar modelos de anúncio salvos
      description: >
        Retorna snapshots completos de anúncios ML (título, fotos, atributos, descrição, etc.)
        sincronizados a partir das contas conectadas, para uso como modelo ao criar novos anúncios.
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: >
            Busca por MLB (ID do anúncio), SKU, título ou texto em atributos/variações.
            Várias palavras: todas devem aparecer (ordem irrelevante).
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Lista paginada de modelos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingTemplateListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /listing-templates/sync:
    post:
      operationId: syncListingTemplates
      tags: [listing-templates]
      summary: Sincronizar modelos a partir de todas as contas
      description: >
        Busca todos os anúncios das contas sincronizadas no Mercado Livre (campos completos)
        e salva/atualiza na tabela de modelos. Processamento em background.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Sync initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /listing-templates/from-product/{productId}:
    post:
      operationId: saveListingTemplateFromProduct
      tags: [listing-templates]
      summary: Salvar um produto existente como modelo
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Modelo criado/atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ListingTemplateDetail"
                required: [data]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Mercado Livre API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /listing-templates/{id}:
    get:
      operationId: getListingTemplate
      tags: [listing-templates]
      summary: Obter modelo com payload completo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Modelo de anúncio
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ListingTemplateDetail"
                required: [data]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteListingTemplate
      tags: [listing-templates]
      summary: Remover modelo de anúncio
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /listing-templates/{id}/publish:
    post:
      operationId: publishListingTemplate
      tags: [listing-templates]
      summary: Publicar novo anúncio a partir de um modelo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishListingTemplateRequest"
      responses:
        "201":
          description: Anúncio publicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishListingTemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Mercado Livre API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

