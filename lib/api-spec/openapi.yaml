  # ---------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPI summary
      description: Returns consolidated KPIs including today/month sales, pending orders, and unanswered questions
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/vacation-mode:
    get:
      operationId: getVacationMode
      tags: [dashboard]
      summary: Estado do Modo Férias
      description: >-
        Retorna se o Modo Férias está ativo e quantos anúncios cross-docking estão ativos ou pausados
        em todas as contas do usuário.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado do Modo Férias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacationModeState"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: setVacationMode
      tags: [dashboard]
      summary: Ativar ou desativar Modo Férias
      description: >-
        ON pausa em massa anúncios cross-docking ativos em todas as contas (Full não é alterado).
        OFF reativa todos os cross-docking pausados.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVacationModeRequest"
      responses:
        "200":
          description: Resultado da operação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacationModeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/ml-extra-costs:
    get:
      operationId: getMlExtraCosts
      tags: [dashboard]
      summary: Custos extras cobrados pelo Mercado Livre
      description: >-
        Product Ads, envios Full e armazenamento Full acumulados no mês calendário selecionado
        (padrão: mês atual). Use period_key para consultar meses anteriores (formato YYYY-MM-01).
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: period_key
          in: query
          description: Chave do mês calendário (YYYY-MM-01). Padrão = mês atual (America/Sao_Paulo).
          schema:
            type: string
            example: "2026-05-01"
      responses:
        "200":
          description: Breakdown de custos extras ML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MlExtraCostsBreakdown"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/sales-chart:
    get:
      operationId: getSalesChart
      tags: [dashboard]
      summary: Get sales chart data
      description: Returns daily sales data for the specified period
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sales chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesChartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/sales-report:
    get:
      operationId: getSalesReport
      tags: [dashboard]
      summary: Relatório de vendas por período
      description: >-
        Lista pedidos pagos/confirmados no período (data de referência America/Sao_Paulo).
        Cada linha traz: total do pedido, preço de compra dos produtos (inventário), taxas e frete do ML
        (gravados ao sincronizar o pedido), imposto estimado (% por SKU) e lucro
        (subtotal dos itens − taxas − imposto − preço de compra). JSON, CSV, XLSX ou PDF.
      security:
        - bearerAuth: []
      parameters:
        - name: date_from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: account_id
          in: query
          schema:
            type: string
        - name: format
          in: query
          description: Saída JSON (prévia) ou ficheiro para download
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
            default: json
      responses:
        "200":
          description: Relatório (JSON ou ficheiro binário)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReportResponse"
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Webhooks
  # ---------------------------------------------------------------------------
  /webhooks/mercadolivre:
    post:
      operationId: handleMercadoLivreWebhook
      tags: [webhooks]
      summary: Receive Mercado Livre webhook notifications
      description: No JWT auth. Responds 200 immediately and processes async.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MercadoLivreWebhookPayload"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]

  /webhooks/stripe:
    post:
      operationId: handleStripeWebhook
      tags: [webhooks]
      summary: Receive Stripe webhook events
      description: No JWT auth. Validates Stripe signature and processes subscription events.
      responses:
        "200":
          description: Processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                required: [received]

# ==============================================================================
# Components
# ==============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # --------------------------------------------------------------------------
    # Shared
    # --------------------------------------------------------------------------
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required: [page, limit, total, totalPages]

    # --------------------------------------------------------------------------
    # Auth
    # --------------------------------------------------------------------------
    UserProfile:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        plan:
          type: string
          enum: [trial, basic, pro]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        stripeCustomerId:
          type: string
          nullable: true
        stripeSubscriptionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, plan, createdAt]

    # --------------------------------------------------------------------------
    # Accounts
    # --------------------------------------------------------------------------
    Account:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        mlUserId:
          type: string
          nullable: true
        mlNickname:
          type: string
          nullable: true
        mlEmail:
          type: string
          nullable: true
        isActive:
          type: boolean
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        hasMpCredentials:
          type: boolean
          description: Indica se a conta tem credenciais MP configuradas (client_id + access_token)
        mpClientIdMasked:
          type: string
          nullable: true
          description: Últimos 4 chars do Client ID (ou null se não configurado)
        mpClientSecretMasked:
          type: string
          nullable: true
          description: Últimos 4 chars do Client Secret (ou null se não configurado)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, isActive, hasMpCredentials, createdAt, updatedAt]

    UpsertMpCredentialsRequest:
      type: object
      properties:
        mpClientId:
          type: string
          description: Client ID do app Mercado Pago
        mpClientSecret:
          type: string
          description: Client Secret do app Mercado Pago
        mpAccessToken:
          type: string
          description: Access Token de produção do app Mercado Pago
      required: [mpClientId, mpClientSecret, mpAccessToken]

    MpCredentialsStatus:
      type: object
      properties:
        hasMpCredentials:
          type: boolean
        mpClientIdMasked:
          type: string
          nullable: true
        mpClientSecretMasked:
          type: string
          nullable: true
      required: [hasMpCredentials]

    # --------------------------------------------------------------------------
    # Products
    # --------------------------------------------------------------------------
    Product:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        mlItemId:
          type: string
        title:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        originalPrice:
          type: number
          nullable: true
        amount:
          type: number
          nullable: true
          description: >
            Somente na resposta de GET /products: preço atual via GET /items/{id}/prices
            (prices[].amount). Outras rotas não consultam /prices.
        regularAmount:
          type: number
          nullable: true
          description: >
            Somente em GET /products: preço regular (prices[].regular_amount) quando há promoção.
        availableQuantity:
          type: integer
        soldQuantity:
          type: integer
        status:
          type: string
          nullable: true
        listingType:
          type: string
          nullable: true
        logisticType:
          type: string
          nullable: true
        isFull:
          type: boolean
        isFlex:
          type: boolean
        catalogListing:
          type: boolean
          description: >
            True quando o anúncio vem de catálogo compartilhado do ML (GET /items → catalog_listing).
        videoId:
          type: string
          nullable: true
          description: >
            Presente em GET /products: ID do vídeo/clip do anúncio quando GET /items retorna video_id;
            null quando não há clip ou a consulta ao ML falha.
        thumbnail:
          type: string
          nullable: true
        permalink:
          type: string
          nullable: true
        mlCategoryId:
          type: string
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/AccountSummary"
          nullable: true
