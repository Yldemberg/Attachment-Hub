  # ---------------------------------------------------------------------------
  /ads/overview:
    get:
      operationId: getAdsOverview
      tags: [ads]
      summary: Dashboard de Product Ads (KPIs, alertas, tendência e campanhas)
      description: >-
        Retorna visão consolidada de Product Ads (PADS) para as contas ML do usuário:
        KPIs do período com variação vs período anterior, alertas de performance,
        série diária (gasto × faturamento) e lista de campanhas.
        Período padrão: mês calendário atual até hoje (America/Sao_Paulo), máximo 90 dias.
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          description: Início do período (YYYY-MM-DD). Padrão = 1º dia do mês atual.
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: Fim do período (YYYY-MM-DD). Padrão = hoje (America/Sao_Paulo).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Overview de Product Ads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"

